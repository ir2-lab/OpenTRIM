name: Windows Build

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.1.5)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # Pinned UCRT64 toolchain (GCC 16.1.0-5, Qt 5.15.19, HDF5 2.1.1, Eigen3 3.4.0,
      # CMake, Ninja, qwt-qt5, qt5-tools, angleproject). See ir2-lab/windows-build-env.
      - name: Set up pinned toolchain
        uses: ir2-lab/windows-build-env@2026.06

      - name: Download dependency packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.2.2 --repo gapost/qmatplotwidget `
            --pattern "*.pkg.tar.zst" `
            --dir C:\Temp\opentrim-pkgs
          gh release download 0.2.2 --repo ir2-lab/libdedx `
            --pattern "*.pkg.tar.zst" `
            --dir C:\Temp\opentrim-pkgs
          gh release download v0.2.1 --repo ir2-lab/QtDataBrowser `
            --pattern "*.pkg.tar.zst" `
            --dir C:\Temp\opentrim-pkgs
          gh release download v0.1.0 --repo ir2-lab/QtVectorEdit `
            --pattern "*.pkg.tar.zst" `
            --dir C:\Temp\opentrim-pkgs

      - name: Install dependency packages
        run: pacman -U --noconfirm /c/Temp/opentrim-pkgs/*.pkg.tar.zst

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENTRIM_BUILD_GUI=ON \
            -DOPENTRIM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Deploy
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          bash dist/mingw64/mingw64-deploy.sh build/OpenTRIM "build/opentrim-${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\opentrim-$env:VERSION" `
            -DestinationPath "build\opentrim-$env:VERSION-win64.zip"

      - name: Create installer
        shell: cmd
        run: >-
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          dist\mingw64\opentrim.iss
          /DMyAppVersion=%VERSION%
          /DMySourceDir=..\..\build\opentrim-%VERSION%
          /Obuild
          &&
          move build\OpenTRIMSetup.exe build\OpenTRIM-%VERSION%-win64-installer.exe

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrim-${{ env.VERSION }}-win64-zip
          path: build/opentrim-${{ env.VERSION }}-win64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrim-${{ env.VERSION }}-win64-installer
          path: build/OpenTRIM-${{ env.VERSION }}-win64-installer.exe

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prerelease = if ($tag -match "[-_]") { "--prerelease" } else { $null }
          $zip = "build/opentrim-$env:VERSION-win64.zip"
          $installer = "build/OpenTRIM-$env:VERSION-win64-installer.exe"
          gh release create $tag --title "OpenTRIM $tag" $prerelease $zip $installer
